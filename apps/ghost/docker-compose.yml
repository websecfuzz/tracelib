services:
  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ghost-root
      MYSQL_DATABASE: ghost
      MYSQL_USER: ghost
      MYSQL_PASSWORD: ghost
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ughost", "-pghost"]
      interval: 5s
      timeout: 3s
      retries: 30
  ghost:
    build:
      context: ../..
      dockerfile: apps/ghost/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "2368:2368"
    environment:
      url: http://localhost:2368
      NODE_ENV: production
      WAIT_FOR_DB: "1"
      database__client: mysql2
      database__connection__host: db
      database__connection__user: ghost
      database__connection__password: ghost
      database__connection__database: ghost
      security__staffDeviceVerification: "false"
    volumes:
      - /dev/shm:/dev/shm
      - ghost_content:/var/lib/ghost/content
      - ./coverage:/coverage
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
volumes:
  db_data:
  ghost_content:
