services:
  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: superset-root
      MYSQL_DATABASE: superset
      MYSQL_USER: superset
      MYSQL_PASSWORD: superset
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-usuperset", "-psuperset"]
      interval: 5s
      timeout: 3s
      retries: 30
  superset:
    build:
      context: ../..
      dockerfile: apps/superset/Dockerfile.lang_cov
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "8096:8096"
    environment:
      SUPERSET_DB_HOST: db
      SUPERSET_DB_NAME: superset
      SUPERSET_DB_USER: superset
      SUPERSET_DB_PASSWORD: superset
      SUPERSET_SECRET_KEY: tracelib-superset-secret-key-not-for-production
      SUPERSET_ADMIN_USER: admin
      SUPERSET_ADMIN_PASSWORD: admin123
      SUPERSET_ADMIN_EMAIL: admin@example.com
      SUPERSET_WORKERS: "2"
      WAIT_FOR_DB: "1"
    volumes:
      - superset_coverage:/coverage
      - superset_home:/app/superset_home

volumes:
  db_data:
  superset_coverage:
  superset_home:
