# Apache Roller configuration for the AgFuzz evaluation image.
#
# database.configurationType=jdbc keeps Roller off JNDI so the connection is
# fully described here; installation.type=auto lets Roller create and upgrade
# its own schema on boot, which replaces the interactive database-setup step of
# the web installer.
installation.type=auto
database.configurationType=jdbc
database.jdbc.driverClass=com.mysql.cj.jdbc.Driver
database.jdbc.connectionURL=jdbc:mysql://db:3306/roller?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
database.jdbc.username=roller
database.jdbc.password=roller

mailserver.configurationType=properties
mail.configurationType=properties

# Disposable evaluation instance: no mail, no captcha.
#
# Password storage is left at Roller's default (bcrypt). Overriding it to
# plaintext was tried and rejected: Roller then *stores* the plaintext but still
# verifies through the configured encoder, so every login failed.
users.registration.enabled=true
users.comments.enabled=true
site.absoluteurl=http://localhost:8099
search.enabled=false
planet.aggregator.enabled=false
